name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # 每天运行
  workflow_dispatch:           # 允许手动触发，支持强制刷新
    inputs:
      force_refresh:
        description: "Force refresh generated metrics"
        type: boolean
        required: false
        default: "false"
  push: {branches: ["master", "main"]}

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-metrics:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats.json
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          set -e
          U=zjncs
          REPOS=$(gh api "users/$U" --jq '.public_repos')
          STARS=$(gh api "users/$U/repos?per_page=100" --paginate --jq '.[].stargazers_count' | awk '{t+=$1} END {print t+0}')
          COMMITS=$(gh api "search/commits?q=author:$U" --jq '.total_count')
          gh api "search/commits?q=author:$U&per_page=100" --paginate --jq '.items[].repository.full_name' | sort -u | while read -r r; do
            s=$(gh api "repos/$r" --jq '.stargazers_count' 2>/dev/null || echo 0)
            case "$r" in "$U"/*) ;; *) echo "$s" ;; esac
          done | awk '{t+=$1} END {print t+0}' > /tmp/upstream_stars
          UPSTARS=$(cat /tmp/upstream_stars)
          jq -n --argjson r "$REPOS" --argjson s "$STARS" --argjson c "$COMMITS" --argjson u "$UPSTARS" \
            '{repos:$r, stars:$s, commits:$c, upstream_stars:$u}' > stats.json
          cat stats.json

      - name: Commit stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update stats.json [skip ci]"
            git push
          fi

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # 基础配置
          user: zjncs
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          
          # 插件：语言分析
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell,
            gnuplot
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          
          # 插件：Isometric Commit Calendar (那个立体的提交日历)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
